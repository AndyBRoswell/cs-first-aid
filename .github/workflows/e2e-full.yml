name: Full E2E tests

on:
  schedule:
    - cron: '17 3 * * 1' # Every Monday at 03:17 UTC [to avoid peak loads]
  workflow_dispatch: # Allow manual runs from the GitHub Actions page

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Keep complete Git history for Starlight lastUpdated

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version # Use the repository's Node.js version
          cache: pnpm # Cache the pnpm package store

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @cs-first-aid/main exec playwright install --with-deps # Install Chromium, Firefox, and WebKit

      - name: Build
        run: pnpm build # Build the site before starting Playwright preview

      - name: Run full E2E test suite
        run: pnpm --filter @cs-first-aid/main test:e2e # Run all browser projects defined in playwright.config.ts