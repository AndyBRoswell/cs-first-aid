name: Deploy website

on:
  push:
    branches:
      - main # Production deployment
      - dev # Preview deployment
  workflow_dispatch: # Allow manual runs from the Actions page

concurrency:
  group: deploy-${{ github.ref_name }} # Keep deployments independent per branch
  cancel-in-progress: true # Cancel an older run when a newer commit arrives

jobs:
  deploy:
    if: github.ref_name == 'main' || github.ref_name == 'dev' # Never deploy the agent branch, including manual runs
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: pwsh # Use PowerShell Core for all shell commands

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch full Git history so Starlight can calculate accurate lastUpdated values

      - name: Setup pnpm
        uses: pnpm/action-setup@v6 # Reads the pnpm version from packageManager in package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version # Use the Node.js version already defined by this repository
          cache: pnpm # Cache pnpm's package store between workflow runs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile # Fail if pnpm-lock.yaml is inconsistent with package.json

      - name: Build
        run: pnpm build # Build the monorepo; the website is emitted to apps/main/dist

      - name: Typecheck
        run: pnpm typecheck # Stop before deployment if type checking fails

      - name: Test
        run: pnpm test # Stop before deployment if unit tests fail

      - name: Install Chromium
        if: github.ref_name == 'dev'
        run: pnpm --filter @cs-first-aid/main exec playwright install --with-deps chromium # Install only Chromium for dev

      - name: E2E tests (Chromium)
        if: github.ref_name == 'dev'
        run: pnpm --filter @cs-first-aid/main test:e2e --project=chromium # Test dev with Chromium

      - name: Install Firefox
        if: github.ref_name == 'main'
        run: pnpm --filter @cs-first-aid/main exec playwright install --with-deps firefox # Install only Firefox for main

      - name: E2E tests (Firefox)
        if: github.ref_name == 'main'
        run: pnpm --filter @cs-first-aid/main test:e2e --project=firefox # Test main with Firefox

      - name: Deploy to Cloudflare Pages
        id: deploy-cloudflare
        continue-on-error: true # Allow the Netlify deployment to run even if Cloudflare fails
        run: pnpm wrangler pages deploy apps/main/dist --project-name=cs-first-aid --branch=${{ github.ref_name }} --commit-hash=${{ github.sha }} # Upload the prebuilt site directly to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }} # Authenticate Wrangler in CI
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }} # Select the Cloudflare account

      - name: Deploy to Netlify
        id: deploy-netlify
        if: github.ref_name == 'main' # Only mirror the production branch to Netlify
        continue-on-error: true # Record a Netlify failure without blocking the final result check
        run: pnpm netlify deploy --filter '@cs-first-aid/main' --dir=apps/main/dist --prod # Deploy the main site package from this monorepo
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }} # Authenticate Netlify CLI
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }} # Select the existing Netlify project

      - name: Check deployment results
        if: always() && steps.deploy-cloudflare.outcome != 'skipped' # Run only if deployment was actually reached
        run: |
          $failed = $false
          if ("${{ steps.deploy-cloudflare.outcome }}" -ne "success") {
              Write-Host "::error::Cloudflare Pages deployment failed."
              $failed = $true
          }
          if ("${{ github.ref_name }}" -eq "main" -and "${{ steps.deploy-netlify.outcome }}" -ne "success") {
              Write-Host "::error::Netlify deployment failed."
              $failed = $true
          }
          if ($failed) {
              exit 1
          }